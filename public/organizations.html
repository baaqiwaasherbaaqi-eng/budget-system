<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساختار سازمانی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
        }
        .header a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 5px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 13px;
        }
        input[type="checkbox"] {
            width: auto;
            margin-left: 8px;
        }
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 14px;
        }
        button:hover {
            background: #5a67d8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f9fa;
            font-weight: bold;
        }
        .delete-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            font-size: 11px;
        }
        .delete-btn:hover {
            background: #c0392b;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            color: white;
        }
        .badge-general {
            background: #17a2b8;
        }
        .badge-specific {
            background: #6f42c1;
        }
        .badge-cost-center {
            background: #28a745;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            padding-top: 25px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 ساختار سازمانی</h1>
        <a href="/dashboard.html">بازگشت به داشبورد</a>
    </div>

    <div class="container">
        <h2>افزودن سازمان جدید</h2>
        
        <div class="form-row">
            <div class="form-group">
                <label>سال مالی:</label>
                <select id="fiscal_year_id"></select>
            </div>
            <div class="form-group">
                <label>نام سازمان:</label>
                <input type="text" id="name" placeholder="مثلاً معاونت مالی">
            </div>
            <div class="form-group">
                <label>نوع سازمان:</label>
                <select id="type">
                    <option value="general">عمومی</option>
                    <option value="specific">اختصاصی</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>نام مدیر:</label>
                <input type="text" id="manager_name" placeholder="نام مدیر سازمان">
            </div>
            <div class="form-group">
                <label>نام مدیر امور مالی:</label>
                <input type="text" id="finance_manager_name" placeholder="نام مدیر مالی">
            </div>
            <div class="form-group">
                <label>سازمان بالادستی:</label>
                <select id="parent_id">
                    <option value="">ندارد</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" id="is_cost_center" checked>
                    مرکز هزینه مستقل
                </label>
            </div>
        </div>

        <button onclick="addOrganization()">افزودن</button>
        <div class="error" id="error"></div>

        <h2>لیست سازمان‌ها</h2>
        <table>
            <thead>
                <tr>
                    <th>نام سازمان</th>
                    <th>نوع</th>
                    <th>مدیر</th>
                    <th>مدیر مالی</th>
                    <th>مرکز هزینه</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script>
        if (!localStorage.getItem('token')) {
            window.location.href = '/login.html';
        }

        const token = localStorage.getItem('token');

        // لود سال‌های مالی
        async function loadFiscalYears() {
            const response = await fetch('/api/fiscal-years', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const years = await response.json();
            
            const select = document.getElementById('fiscal_year_id');
            select.innerHTML = '<option value="">انتخاب کنید</option>';
            
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year.id;
                option.textContent = year.year;
                select.appendChild(option);
            });
        }

        // لود سازمان‌ها
        async function loadOrganizations() {
            const response = await fetch('/api/organizations', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const items = await response.json();
            
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            // پر کردن select سازمان بالادستی
            const parentSelect = document.getElementById('parent_id');
            parentSelect.innerHTML = '<option value="">ندارد</option>';
            
            items.forEach(item => {
                const option = document.createElement('option');
                option.value = item.id;
                option.textContent = item.name;
                parentSelect.appendChild(option);
            });
            
            items.forEach(item => {
                const row = document.createElement('tr');
                
                const tdName = document.createElement('td');
                tdName.textContent = item.name;
                
                const tdType = document.createElement('td');
                if (item.type === 'general') {
                    tdType.innerHTML = '<span class="badge badge-general">عمومی</span>';
                } else {
                    tdType.innerHTML = '<span class="badge badge-specific">اختصاصی</span>';
                }
                
                const tdManager = document.createElement('td');
                tdManager.textContent = item.manager_name || '-';
                
                const tdFinanceManager = document.createElement('td');
                tdFinanceManager.textContent = item.finance_manager_name || '-';
                
                const tdCostCenter = document.createElement('td');
                if (item.is_cost_center) {
                    tdCostCenter.innerHTML = '<span class="badge badge-cost-center">بله</span>';
                } else {
                    tdCostCenter.textContent = 'خیر';
                }
                
                const tdActions = document.createElement('td');
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'حذف';
                deleteBtn.onclick = () => deleteOrganization(item.id);
                tdActions.appendChild(deleteBtn);
                
                row.appendChild(tdName);
                row.appendChild(tdType);
                row.appendChild(tdManager);
                row.appendChild(tdFinanceManager);
                row.appendChild(tdCostCenter);
                row.appendChild(tdActions);
                
                tbody.appendChild(row);
            });
        }

        // افزودن سازمان
        async function addOrganization() {
            const fiscal_year_id = document.getElementById('fiscal_year_id').value;
            const name = document.getElementById('name').value;
            const type = document.getElementById('type').value;
            const manager_name = document.getElementById('manager_name').value;
            const finance_manager_name = document.getElementById('finance_manager_name').value;
            const parent_id = document.getElementById('parent_id').value;
            const is_cost_center = document.getElementById('is_cost_center').checked;
            
            if (!fiscal_year_id || !name || !type) {
                document.getElementById('error').textContent = 'سال مالی، نام و نوع سازمان الزامی است';
                return;
            }
            
            const response = await fetch('/api/organizations', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    fiscal_year_id: parseInt(fiscal_year_id),
                    name,
                    type,
                    manager_name,
                    finance_manager_name,
                    parent_id: parent_id ? parseInt(parent_id) : null,
                    is_cost_center
                })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                document.getElementById('error').textContent = '';
                document.getElementById('name').value = '';
                document.getElementById('manager_name').value = '';
                document.getElementById('finance_manager_name').value = '';
                loadOrganizations();
            } else {
                document.getElementById('error').textContent = data.error;
            }
        }

        // حذف سازمان
        async function deleteOrganization(id) {
            if (!confirm('مطمئن هستید؟')) return;
            
            const response = await fetch(`/api/organizations/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                loadOrganizations();
            }
        }

        // لود اولیه
        loadFiscalYears();
        loadOrganizations();
    </script>
</body>
</html>
