<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد - سامانه بودجه شهرداری</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"
        type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        input {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .header {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        #user-name {
            font-size: 13px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-card h3 {
            margin: 0 0 10px 0;
            color: #333;
        }

        .menu-card p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>سامانه بودجه شهرداری</h1>
        <div class="user-info">
            <span id="user-name"></span>
            <button class="logout-btn" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="menu">
        <div class="menu-card">
            <h3>📊 بودجه پیشنهادی</h3>
            <p>ثبت و مدیریت بودجه</p>
        </div>
        <div class="menu-card">
            <h3>✅ تصویب بودجه</h3>
            <p>فرآیند تایید و تصویب</p>
        </div>
        <div class="menu-card">
            <h3>💰 اجرای بودجه</h3>
            <p>تخصیص و تامین اعتبار</p>
        </div>
        <div class="menu-card">
            <h3>📈 گزارشات</h3>
            <p>گزارش‌های مالی و بودجه‌ای</p>
        </div>
        <div class="menu-card">
            <h3>👥 مدیریت کاربران</h3>
            <p>کاربران و سطوح دسترسی</p>
        </div>
        <div class="menu-card">
            <h3>⚙️ تنظیمات</h3>
            <p>سال مالی و تنظیمات سیستم</p>
        </div>
    </div>

    <script>
        // بررسی لاگین بودن
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || '{}');

        if (!token) {
            window.location.href = '/login.html';
        }

        document.getElementById('user-name').textContent =
            `${user.full_name} (${user.role})`;

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        }
    </script>
</body>

</html>
