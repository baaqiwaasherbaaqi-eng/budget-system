<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پرونده پرسنلی</title>
    <link rel="stylesheet" href="/sidebar.css" />
    <script src="/sidebar.js"></script>
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
      rel="stylesheet"
      type="text/css"
    />

    <!-- Persian DatePicker -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Vazirmatn", Tahoma, sans-serif;
        background: #f0f2f5;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      /* ============ Person Header ============ */
      .person-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 25px 30px;
        border-radius: 10px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .person-avatar {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: bold;
        flex-shrink: 0;
      }

      .person-info {
        flex: 1;
      }

      .person-info h1 {
        margin: 0 0 8px 0;
        font-size: 22px;
      }

      .person-info .meta {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        font-size: 13px;
        opacity: 0.9;
      }

      .person-info .meta span {
        background: rgba(255, 255, 255, 0.15);
        padding: 4px 12px;
        border-radius: 12px;
      }

      .back-btn {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-size: 13px;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: background 0.2s;
      }

      .back-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      /* ============ Tabs ============ */
      .tabs-nav {
        display: flex;
        gap: 5px;
        background: white;
        padding: 8px;
        border-radius: 10px;
        margin-bottom: 20px;
        overflow-x: auto;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
      }

      .tab-item {
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-size: 13px;
        color: #666;
        white-space: nowrap;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        background: transparent;
      }

      .tab-item:hover {
        background: #f0f2f5;
        color: #667eea;
      }

      .tab-item.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        font-weight: bold;
      }

      /* ============ Tab Content ============ */
      .tab-content {
        background: white;
        border-radius: 10px;
        padding: 25px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        min-height: 400px;
      }

      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }

      /* ============ Form ============ */
      .section-divider {
        margin: 25px 0 15px 0;
        padding-bottom: 8px;
        border-bottom: 2px solid #e9ecef;
        font-size: 14px;
        font-weight: bold;
        color: #667eea;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-divider:first-child {
        margin-top: 0;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 15px;
      }

      .form-row-3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 15px;
        margin-bottom: 15px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
        font-size: 13px;
      }

      .form-group label .required {
        color: #e74c3c;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-size: 13px;
        background: white;
        transition: border-color 0.2s;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 70px;
      }

      /* ============ Actions ============ */
      .actions-bar {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e9ecef;
      }

      .btn {
        padding: 12px 30px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-size: 14px;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-save {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
      }

      .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
      }

      .btn-save:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* ============ Placeholder ============ */
      .placeholder {
        text-align: center;
        padding: 80px 20px;
        color: #999;
      }

      .placeholder .icon {
        font-size: 60px;
        margin-bottom: 15px;
        opacity: 0.5;
      }

      .placeholder h3 {
        margin: 0 0 8px 0;
        color: #666;
        font-size: 16px;
      }

      .placeholder p {
        margin: 0;
        font-size: 13px;
      }

      /* ============ Loading ============ */
      .loading {
        text-align: center;
        padding: 60px 20px;
        color: #999;
      }

      .loading .spinner {
        display: inline-block;
        width: 30px;
        height: 30px;
        border: 3px solid #e9ecef;
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 15px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ============ Toast ============ */
      .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #333;
        color: white;
        padding: 12px 24px;
        border-radius: 8px;
        font-size: 14px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        z-index: 10002;
        transition: transform 0.3s;
        font-family: "Vazirmatn", Tahoma, sans-serif;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
      }
      .toast.success {
        background: #28a745;
      }
      .toast.error {
        background: #dc3545;
      }

      /* ============ Dark Mode ============ */
      body.dark {
        background: #1a202c;
        color: #e2e8f0;
      }
      body.dark .tabs-nav,
      body.dark .tab-content {
        background: #2d3748;
      }
      body.dark .tab-item {
        color: #a0aec0;
      }
      body.dark .tab-item:hover {
        background: #4a5568;
      }
      body.dark .tab-item.active {
        color: white;
      }
      body.dark .section-divider {
        border-bottom-color: #4a5568;
      }
      body.dark .form-group label {
        color: #cbd5e0;
      }
      body.dark .form-group input,
      body.dark .form-group textarea,
      body.dark .form-group select {
        background: #1a202c;
        border-color: #4a5568;
        color: #e2e8f0;
      }
      body.dark .actions-bar {
        border-top-color: #4a5568;
      }

      /* ============ Responsive ============ */
      @media (max-width: 768px) {
        .person-header {
          padding: 15px 20px;
        }
        .person-info h1 {
          font-size: 18px;
        }
        .form-row,
        .form-row-3 {
          grid-template-columns: 1fr;
        }
        .tabs-nav {
          padding: 5px;
        }
        .tab-item {
          padding: 8px 12px;
          font-size: 12px;
        }
      }

      /* ============ Tasks ============ */
      .tasks-container {
        margin-bottom: 20px;
      }

      .task-item {
        background: #f8f9fa;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 12px;
        border-right: 4px solid #667eea;
        transition: all 0.2s;
      }

      .task-item:hover {
        background: #eef1ff;
      }

      .task-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .task-row .form-group {
        margin-bottom: 0;
      }

      .task-remove-btn {
        background: #dc3545;
        color: white;
        border: none;
        width: 36px;
        height: 36px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        flex-shrink: 0;
      }

      .task-remove-btn:hover {
        background: #c82333;
        transform: scale(1.05);
      }

      .add-task-btn {
        background: #17a2b8;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        font-size: 13px;
        transition: all 0.2s;
        margin-bottom: 20px;
      }

      .add-task-btn:hover {
        background: #138496;
        transform: translateY(-1px);
      }

      .total-bar {
        background: #f8f9fa;
        padding: 15px 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        border-right: 4px solid #667eea;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
      }

      .total-bar strong {
        font-size: 18px;
      }

      .info-banner {
        background: #e7f3ff;
        border-right: 4px solid #17a2b8;
        padding: 12px 18px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 13px;
        color: #0c5460;
        line-height: 1.7;
      }

      body.dark .task-item {
        background: #374151;
      }

      body.dark .task-item:hover {
        background: #4a5568;
      }

      body.dark .total-bar {
        background: #374151;
        color: #e2e8f0;
      }

      body.dark .info-banner {
        background: #1a202c;
        color: #90cdf4;
      }

    /* ============ Dependents ============ */
    .dependents-container {
      margin-bottom: 20px;
    }

    .dependent-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      border-right: 4px solid #28a745;
      transition: all 0.2s;
    }

    .dependent-item:hover {
      background: #eef9f0;
    }

    .dependent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .dependent-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dependent-icon {
      font-size: 20px;
    }

    .dependent-name {
      font-weight: bold;
      font-size: 15px;
      color: #333;
    }

    .dependent-badge {
      background: #28a745;
      color: white;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 11px;
    }

    .dependent-actions {
      display: flex;
      gap: 5px;
    }

    .dep-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dep-edit-btn {
      background: #ffc107;
      color: #333;
    }

    .dep-edit-btn:hover {
      background: #e0a800;
      transform: scale(1.05);
    }

    .dep-delete-btn {
      background: #dc3545;
      color: white;
    }

    .dep-delete-btn:hover {
      background: #c82333;
      transform: scale(1.05);
    }

    .dependent-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .info-row {
      display: flex;
      gap: 5px;
      font-size: 12px;
    }

    .info-label {
      color: #666;
      min-width: 80px;
    }

    .info-value {
      color: #333;
      font-weight: 500;
    }

    .dependent-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge-allowance {
      background: #fff3cd;
      color: #856404;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
    }

    .badge-insurance {
      background: #d1ecf1;
      color: #0c5460;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
    }

    .badge-disabled {
      background: #f8d7da;
      color: #721c24;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
    }

    .dependents-summary {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px 18px;
      margin-bottom: 20px;
      font-size: 13px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      border-right: 4px solid #28a745;
    }

    .summary-item {
      color: #333;
    }

    /* Modal */
    .dependent-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      padding: 20px;
    }

    .dependent-modal-overlay.open {
      display: flex;
    }

    .dependent-modal {
      background: white;
      border-radius: 12px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.2s;
    }

    .dependent-modal-header {
      padding: 20px 25px;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dependent-modal-header h3 {
      margin: 0;
      font-size: 16px;
      color: #333;
    }

    .dep-modal-close {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 20px;
      color: #999;
      width: 30px;
      height: 30px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .dep-modal-close:hover {
      background: #f0f2f5;
      color: #333;
    }

    .dependent-modal-body {
      padding: 25px;
    }

    .dependent-modal-footer {
      padding: 20px 25px;
      border-top: 1px solid #e9ecef;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-lookup {
      background: #17a2b8;
      color: white;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .btn-lookup:hover {
      background: #138496;
      transform: scale(1.05);
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Dark Mode */
    body.dark .dependent-item {
      background: #374151;
    }
    body.dark .dependent-item:hover {
      background: #4a5568;
    }
    body.dark .dependent-name {
      color: #e2e8f0;
    }
    body.dark .info-label {
      color: #a0aec0;
    }
    body.dark .info-value {
      color: #e2e8f0;
    }
    body.dark .dependents-summary {
      background: #374151;
      color: #e2e8f0;
    }
    body.dark .dependent-modal {
      background: #2d3748;
    }
    body.dark .dependent-modal-header {
      border-bottom-color: #4a5568;
    }
    body.dark .dependent-modal-header h3 {
      color: #e2e8f0;
    }
    body.dark .dependent-modal-footer {
      border-top-color: #4a5568;
    }

    /* ============ Decrees ============ */
    .decrees-container {
      margin-bottom: 20px;
    }

    .decree-item {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 12px;
      border-right: 4px solid #667eea;
      transition: all 0.2s;
    }

    .decree-item:hover {
      background: #eef1ff;
    }

    .decree-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .decree-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .decree-icon {
      font-size: 20px;
    }

    .decree-type {
      font-weight: bold;
      font-size: 15px;
      color: #333;
    }

    .decree-number {
      font-family: monospace;
      font-size: 11px;
      background: white;
      padding: 3px 10px;
      border-radius: 12px;
      color: #667eea;
    }

    .decree-status {
      color: white;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
    }

    .decree-actions {
      display: flex;
      gap: 5px;
    }

    .decree-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .decree-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #e9ecef;
      flex-wrap: wrap;
      gap: 10px;
    }

    .decree-total {
      font-size: 13px;
      color: #333;
    }

    .decree-total strong {
      color: #28a745;
      font-size: 15px;
    }

    .decree-items-count {
      font-size: 12px;
      color: #667eea;
    }

    body.dark .decree-item {
      background: #374151;
    }
    body.dark .decree-item:hover {
      background: #4a5568;
    }
    body.dark .decree-type {
      color: #e2e8f0;
    }
    body.dark .decree-number {
      background: #1a202c;
    }
    body.dark .decree-footer {
      border-top-color: #4a5568;
    }
    body.dark .decree-total {
      color: #e2e8f0;
    }


    /* ============ Decree Items (داخل Modal) ============ */
    .decree-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 6px;
      gap: 10px;
    }

    .decree-item-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #333;
      flex: 1;
    }

    .decree-item-code {
      font-weight: bold;
      color: #667eea;
      font-family: monospace;
      min-width: 30px;
    }

    .decree-item-input {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .decree-item-input input {
      width: 150px;
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      font-size: 13px;
      text-align: left;
      direction: ltr;
    }

    .decree-item-input input:focus {
      outline: none;
      border-color: #667eea;
    }

    .currency {
      font-size: 11px;
      color: #999;
    }

    .decree-total-box {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin: 15px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    .decree-total-box strong {
      font-size: 22px;
    }

    body.dark .decree-item-row {
      background: #374151;
    }
    body.dark .decree-item-label {
      color: #e2e8f0;
    }
    body.dark .decree-item-input input {
      background: #1a202c;
      border-color: #4a5568;
      color: #e2e8f0;
    }

    </style>
  </head>

  <body>

      function showToast(message, type = "success") {

      // تبدیل تاریخ انگلیسی (1405/06/29) به فارسی (۱۴۰۵/۰۶/۲۹)
      function toPersianDate(dateStr) {
        if (!dateStr) return "";
        return toPersianNumbers(dateStr);
      }

      // ============================================
      // پاک‌سازی تاریخ (تبدیل به فرمت YYYY/MM/DD انگلیسی)
      // ============================================
      function cleanDate(value) {
        if (!value) return null;

        // تبدیل اعداد فارسی به انگلیسی
        let normalized = toEnglishNumbers(value.toString());
        const trimmed = normalized.trim();
        if (!trimmed) return null;

        // اگه شامل `/` هست
        if (trimmed.includes("/")) {
          const match = trimmed.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
          if (match) {
            return `${match[1]}/${match[2].padStart(
              2,
              "0"
            )}/${match[3].padStart(2, "0")}`;
          }
        }

        // اگه شامل نام ماه هست (مثل "شنبه ۱۸ مهر ۱۴۰۵")
        const months = [
          "فروردین",
          "اردیبهشت",
          "خرداد",
          "تیر",
          "مرداد",
          "شهریور",
          "مهر",
          "آبان",
          "آذر",
          "دی",
          "بهمن",
          "اسفند",
        ];
        const parts = trimmed.split(/\s+/);

        for (let i = 0; i < parts.length; i++) {
          const monthIndex = months.indexOf(parts[i]);
          if (monthIndex >= 0) {
            const day = parts[i - 1];
            const year = parts[i + 1];

            if (day && year && /^\d+$/.test(day) && /^\d+$/.test(year)) {
              const m = (monthIndex + 1).toString().padStart(2, "0");
              const d = day.padStart(2, "0");
              return `${year}/${m}/${d}`;
            }
          }
        }

        return null;
      }

    // ============================================
    // ذخیره اطلاعات پایه
    // ============================================
    async function saveBasicInfo() {
      const btn = document.getElementById('btn-save-basic');
      btn.disabled = true;
      btn.textContent = '⏳ در حال ذخیره...';

      try {
        const firstName = document.getElementById('basic-first-name').value.trim();
        const lastName = document.getElementById('basic-last-name').value.trim();
        const fullName = `${firstName} ${lastName}`.trim();

        if (!fullName) {
          throw new Error('نام و نام خانوادگی الزامی است');
        }

        const data = {
          full_name: fullName,
          first_name: firstName || null,
          last_name: lastName || null,
          father_name: document.getElementById('basic-father-name').value.trim() || null,
          mother_name: document.getElementById('basic-mother-name').value.trim() || null,
          national_id: document.getElementById('basic-national-id').value.trim() || null,
          id_number: document.getElementById('basic-id-number').value.trim() || null,
          birth_date_shamsi: cleanDate(document.getElementById('basic-birth-date').value),
          birth_place: document.getElementById('basic-birth-place').value.trim() || null,
          gender: document.getElementById('basic-gender').value || null,
          nationality: document.getElementById('basic-nationality').value.trim() || 'ایرانی',
          mobile: document.getElementById('basic-mobile').value.trim() || null,
          phone: document.getElementById('basic-phone').value.trim() || null,
          address: document.getElementById('basic-address').value.trim() || null,
          postal_code: document.getElementById('basic-postal-code').value.trim() || null,
          email: document.getElementById('basic-email').value.trim() || null,
          bank_name: document.getElementById('basic-bank-name').value.trim() || null,
          bank_account: document.getElementById('basic-bank-account').value.trim() || null,
          iban: document.getElementById('basic-iban').value.trim() || null,
          is_active: person.is_active,
        };

        const res = await fetch(`/api/persons/${personId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'خطا');

        showToast('اطلاعات پایه با موفقیت ذخیره شد');

        // ریلود اطلاعات
        const res2 = await fetch(`/api/employees/${personId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data2 = await res2.json();
        person = data2.person;

        // رفرش تب
        const panel = document.getElementById('panel-basic');
        if (panel) {
          panel.innerHTML = renderBasicTab();
          setTimeout(initBasicDatePickers, 100);
        }
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 ذخیره اطلاعات پایه';
      }
    }

        format: 'YYYY/MM/DD',
        autoClose: true,
        persianDigit: true,
        initialValue: !!el.value
      });
    }

    // ============================================
    // تغییر نوع حکم
    // ============================================
    async function onDecreeTypeChange() {
      const type = document.getElementById('decree-type').value;
      if (!type) return;
      currentDecreeType = type;
      await loadDecreeItems(type);
    }

    // ============================================
    // بارگذاری آیتم‌های حقوق
    // ============================================
    async function loadDecreeItems(decreeType) {
      try {
        const res = await fetch(`/api/decree-items?decree_type=${decreeType}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const templateItems = await res.json();

        // merge با آیتم‌های فعلی
        const merged = templateItems.map(t => {
          const existing = currentDecreeItems.find(ci => ci.code === t.code);
          return {
            code: t.code,
            title: t.title,
            amount: existing ? existing.amount : 0
          };
        });

        currentDecreeItems = merged;
        renderDecreeItems();
      } catch (error) {
        console.error('Load items error:', error);
      }
    }

    // ============================================
    // رندر آیتم‌های حقوق
    // ============================================
    function renderDecreeItems() {
      const container = document.getElementById('decree-items-container');
      if (!container) return;

      if (currentDecreeItems.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#999;">آیتمی برای این نوع حکم یافت نشد</div>`;
        return;
      }

      let html = '';
      currentDecreeItems.forEach((item, index) => {
        html += `
          <div class="decree-item-row">
            <div class="decree-item-label">
              <span class="decree-item-code">${item.code})</span>
              <span>${item.title}</span>
            </div>
            <div class="decree-item-input">
              <input type="text" 
                     class="amount-input" 
                     value="${item.amount ? formatAmount(item.amount) : ''}" 
                     placeholder="۰"
                     oninput="onDecreeAmountChange(${index}, this)" />
              <span class="currency">ریال</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      // راه‌اندازی فرمت مبلغ
      container.querySelectorAll('.amount-input').forEach((input, idx) => {
        input.addEventListener('input', function() {
          let value = toEnglishNumbers(this.value);
          value = value.replace(/,/g, '').replace(/[^\d]/g, '');
          if (value === '') {
            this.value = '';
            return;
          }
          this.value = toPersianNumbers(value.replace(/\B(?=(\d{3})+(?!\d))/g, ','));
        });
      });

      updateDecreeTotal();
    }

    // ============================================
    // تغییر مبلغ آیتم
    // ============================================
    function onDecreeAmountChange(index, input) {
      let value = toEnglishNumbers(input.value);
      value = value.replace(/,/g, '').replace(/[^\d]/g, '');
      currentDecreeItems[index].amount = value === '' ? 0 : parseInt(value);
      updateDecreeTotal();
    }

    // ============================================
    // محاسبه جمع کل
    // ============================================
    function updateDecreeTotal() {
      const total = currentDecreeItems.reduce((sum, item) => sum + (item.amount || 0), 0);
      const totalEl = document.getElementById('decree-total-amount');
      if (totalEl) {
        totalEl.textContent = formatAmount(total);
      }
      return total;
    }

    // ============================================
    // ذخیره حکم
    // ============================================
    async function saveDecree(decreeId) {
      const btn = document.getElementById('btn-save-decree');
      btn.disabled = true;
      btn.textContent = '⏳ در حال ذخیره...';

      try {
        const decreeType = document.getElementById('decree-type').value;
        if (!decreeType) {
          throw new Error('نوع حکم الزامی است');
        }

        const total = updateDecreeTotal();

        const data = {
          id: decreeId || null,
          decree_type: decreeType,
          decree_number: document.getElementById('decree-number').value.trim() || null,
          decree_date_shamsi: cleanDate(document.getElementById('decree-date').value),
          execution_date_shamsi: cleanDate(document.getElementById('decree-execution-date').value),
          contract_start_shamsi: cleanDate(document.getElementById('decree-contract-start').value),
          contract_end_shamsi: cleanDate(document.getElementById('decree-contract-end').value),
          description: document.getElementById('decree-description').value.trim() || null,
          organization_unit: document.getElementById('decree-org-unit').value.trim() || null,
          service_location: document.getElementById('decree-service-location').value.trim() || null,
          position_title: document.getElementById('decree-position').value.trim() || null,
          job_group: document.getElementById('decree-job-group').value.trim() || null,
          job_rank: document.getElementById('decree-job-rank').value.trim() || null,
          job_class: document.getElementById('decree-job-class').value.trim() || null,
          employment_type: document.getElementById('decree-employment-type').value.trim() || null,
          employment_duration: document.getElementById('decree-employment-duration').value.trim() || null,
          service_history_years: parseInt(document.getElementById('decree-service-years').value) || 0,
          service_history_months: parseInt(document.getElementById('decree-service-months').value) || 0,
          service_history_days: parseInt(document.getElementById('decree-service-days').value) || 0,
          experience_years: parseInt(document.getElementById('decree-exp-years').value) || 0,
          experience_months: parseInt(document.getElementById('decree-exp-months').value) || 0,
          experience_days: parseInt(document.getElementById('decree-exp-days').value) || 0,
          items: currentDecreeItems.filter(i => i.amount > 0),
          total_amount: total,
          total_in_words: document.getElementById('decree-total-words').value.trim() || null,
          notes: document.getElementById('decree-notes').value.trim() || null,
        };

        const res = await fetch(`/api/employees/${personId}/decrees`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'خطا');

        showToast(decreeId ? 'با موفقیت ویرایش شد' : 'با موفقیت ثبت شد');
        closeDecreeModal();

        // ریلود
        const decreesRes = await fetch(`/api/employees/${personId}/decrees`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        decrees = await decreesRes.json();

        const panel = document.getElementById('panel-decrees');
        if (panel) panel.innerHTML = renderDecreesTab();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 ذخیره';
      }
    }

    // ============================================
    // ارسال برای امضا (Mock SMS)
    // ============================================
    async function sendDecreeForSignature(decreeId) {
      const decree = decrees.find(d => d.id === decreeId);
      if (!decree) return;

      // چک موبایل
      const mobile = person.mobile;
      if (!mobile) {
        showToast('شماره موبایل کارمند ثبت نشده است', 'error');
        return;
      }

      if (!confirm(`ارسال کد تایید به موبایل ${mobile}؟`)) return;

      try {
        const res = await fetch('/api/signatures/send-otp', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            entity_type: 'decree',
            entity_id: decreeId,
            employee_person_id: personId,
            mobile: mobile
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'خطا در ارسال');

        // نمایش OTP در حالت mock
        if (data.mock_otp) {
          showToast(`کد تایید (mock): ${data.mock_otp}`, 'success');
          
          // پرامپت برای وارد کردن OTP
          setTimeout(() => {
            const otp = prompt(`کد تایید ارسال شده به ${mobile} را وارد کنید:\n(Mock: ${data.mock_otp})`);
            if (otp) {
              verifySignature(data.signature_id, otp);
            }
          }, 500);
        }
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            signature_id: signatureId,
            otp_code: otpCode
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'کد اشتباه');

        showToast('✅ امضا با موفقیت ثبت شد');

        // ریلود
        const decreesRes = await fetch(`/api/employees/${personId}/decrees`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        decrees = await decreesRes.json();

        const panel = document.getElementById('panel-decrees');
        if (panel) panel.innerHTML = renderDecreesTab();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

      if (relation === 'son') {
        groupMilitary.style.display = 'block';
      } else {
        groupMilitary.style.display = 'none';
      }

    async function saveDependent(depId) {
      const btn = document.getElementById('btn-save-dependent');
      btn.disabled = true;
      btn.textContent = '⏳ در حال ذخیره...';

      try {
        const firstName = document.getElementById('dep-first-name').value.trim();
        const lastName = document.getElementById('dep-last-name').value.trim();
        const fullName = `${firstName} ${lastName}`.trim();

        if (!fullName) {
          throw new Error('نام الزامی است');
        }

        const relationType = document.getElementById('dep-relation-type').value;
        if (!relationType) {
          throw new Error('نسبت الزامی است');
        }

        const data = {
          id: depId || null,
          national_id: document.getElementById('dep-national-id').value.trim() || null,
          relation_type: relationType,
          first_name: firstName || null,
          last_name: lastName || null,
          full_name: fullName,
          father_name: document.getElementById('dep-father-name').value.trim() || null,
          id_number: document.getElementById('dep-id-number').value.trim() || null,
          birth_date_shamsi: cleanDate(document.getElementById('dep-birth-date').value),
          gender: document.getElementById('dep-gender').value || null,
          mobile: document.getElementById('dep-mobile').value.trim() || null,
          education_status: document.getElementById('dep-education-status')?.value || null,
          military_status: document.getElementById('dep-military-status')?.value || null,
          marital_status: document.getElementById('dep-marital-status').value || null,
          marriage_date_shamsi: cleanDate(document.getElementById('dep-marriage-date').value),
          is_disabled: document.getElementById('dep-is-disabled').checked ? 1 : 0,
          notes: document.getElementById('dep-notes').value.trim() || null,
        };

        const res = await fetch(`/api/employees/${personId}/dependents`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'خطا');

        showToast(depId ? 'با موفقیت ویرایش شد' : 'با موفقیت ثبت شد');
        closeDependentModal();

        // ریلود
        const depsRes = await fetch(`/api/employees/${personId}/dependents`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        dependents = await depsRes.json();

        const panel = document.getElementById('panel-dependents');
        if (panel) {
          panel.innerHTML = renderDependentsTab();
        }
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '💾 ذخیره';
      }
    }

        const depsRes = await fetch(`/api/employees/${personId}/dependents`, {

      // ============================================
      // رندر گزینه‌های طبقه‌بندی عملیاتی
      // ============================================
      function renderOperationalOptions(selectedId) {
        const typeLabels = {
          mission: "🎯",
          program: "📋",
          service: "⚙️",
          plan: "📐",
          activity: "🔧",
          project: "🏗️",
        };

        let html = '<option value="">— انتخاب کنید —</option>';

        operationalItems.forEach((item) => {
          const icon = typeLabels[item.type] || "📄";
          const indent = "　".repeat(item.level);
          const selected = item.id == selectedId ? "selected" : "";

        html += `<option value="${item.id}" data-type="${item.type}" data-title="${item.title}" ${selected}>
          ${indent}${icon} ${item.code} - ${item.title}
        </option>`;
        });

        return html;
      }

      // ============================================
      // افزودن وظیفه جدید
      // ============================================
      function addTask() {
        employeeTasks.push({
          task_id: "",
          task_type: "",
          task_title: "",
          percentage: 0,
          notes: "",
        });

        // رفرش تب وظایف
        const panel = document.getElementById("panel-tasks");
        if (panel) {
          panel.innerHTML = renderTasksTab();
        }
      }

      // ============================================
      // حذف وظیفه
      // ============================================
      function removeTask(index) {
        if (!confirm("مطمئن هستید این وظیفه حذف شود؟")) return;

        employeeTasks.splice(index, 1);

        const panel = document.getElementById("panel-tasks");
        if (panel) {
          panel.innerHTML = renderTasksTab();
        }
      }

      // ============================================
      // تغییر وظیفه
      // ============================================
      function onTaskChange(index, taskId) {
        if (!taskId) {
          employeeTasks[index].task_id = "";
          employeeTasks[index].task_type = "";
          employeeTasks[index].task_title = "";
          return;
        }

        const taskIdNum = parseInt(taskId);

        // چک تکراری بودن
        const isDuplicate = employeeTasks.some(
          (t, i) =>
            i !== index && t.task_id && parseInt(t.task_id) === taskIdNum
        );

        if (isDuplicate) {
          showToast("این وظیفه قبلاً انتخاب شده است", "error");
          // ریست کردن select
          const selectEl = document.querySelector(
            `.task-item[data-index="${index}"] .task-select`
          );
          if (selectEl) selectEl.value = "";
          return;
        }

        const selectedOption = document.querySelector(
          `.task-item[data-index="${index}"] .task-select option:checked`
        );
        if (selectedOption) {
          employeeTasks[index].task_id = taskIdNum;
          employeeTasks[index].task_type = selectedOption.dataset.type || "";
          employeeTasks[index].task_title = selectedOption.dataset.title || "";
        }

        // رفرش برای نمایش نوع
        const panel = document.getElementById("panel-tasks");
        if (panel) {
          panel.innerHTML = renderTasksTab();
        }
      }
      // ============================================
      // تغییر درصد
      // ============================================
      function onPercentageChange(index, value) {
        employeeTasks[index].percentage = parseInt(value) || 0;

        // رفرش برای آپدیت جمع
        const panel = document.getElementById("panel-tasks");
        if (panel) {
          panel.innerHTML = renderTasksTab();
        }
      }

      // ============================================
      // تغییر یادداشت
      // ============================================
      function onNotesChange(index, value) {
        employeeTasks[index].notes = value || "";
      }

      // ============================================
      // ذخیره وظایف
      // ============================================
      async function saveTasks() {
        const btn = document.getElementById("btn-save-tasks");
        btn.disabled = true;
        btn.textContent = "⏳ در حال ذخیره...";

        try {
          // فیلتر کردن وظایف خالی
          let validTasks = employeeTasks.filter(
            (t) => t.task_id && t.task_type
          );

          // حذف تکراری‌ها (merge percentage)
          const mergedTasks = {};
          validTasks.forEach((t) => {
            const key = t.task_id;
            if (mergedTasks[key]) {
              mergedTasks[key].percentage += t.percentage || 0;
            } else {
              mergedTasks[key] = { ...t };
            }
          });
          validTasks = Object.values(mergedTasks);

          const res = await fetch(`/api/employees/${personId}/tasks`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ tasks: validTasks }),
          });

          const result = await res.json();
          if (!res.ok) throw new Error(result.error || "خطا");

          showToast("وظایف با موفقیت ذخیره شد");

          // ریلود
          const tasksRes = await fetch(`/api/employees/${personId}/tasks`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          employeeTasks = await tasksRes.json();

          const panel = document.getElementById("panel-tasks");
          if (panel) {
            panel.innerHTML = renderTasksTab();
          }
        } catch (error) {
          showToast(error.message, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = "💾 ذخیره وظایف";
        }
      }
      // ============================================
      // سوئیچ تب
      // ============================================
      function switchTab(tabName, btn) {
        document
          .querySelectorAll(".tab-item")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab-panel")
          .forEach((p) => p.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById("panel-" + tabName).classList.add("active");

        if (tabName === "employment") {
          datePickersInitialized = false;
          setTimeout(initDatePickers, 100);
        }
      }

      // ============================================
      // Date Picker
      // ============================================
      function initDatePickers() {
        if (datePickersInitialized) return;

        const dateFields = [
          "input-hire-date",
          "input-contract-start",
          "input-contract-end",
          "input-birthday",
          "input-other-occasion-date",
          "input-unit-start-date",
        ];

        dateFields.forEach((id) => {
          const el = document.getElementById(id);
          if (!el || el.disabled) return;

          // ذخیره مقدار فعلی
          const currentValue = el.value;

          // پاک کردن نمونه قبلی
          try {
            $("#" + id).persianDatepicker("destroy");
          } catch (e) {}

          // راه‌اندازی مجدد
          $("#" + id).persianDatepicker({
            format: "YYYY/MM/DD",
            autoClose: true,
            persianDigit: true,
            initialValue: !!currentValue,
            observer: true,
          });

          // برگرداندن مقدار قبلی
          if (currentValue) {
            el.value = currentValue;
          }
        });

        datePickersInitialized = true;
      }

      // ============================================
      // شروع
      // ============================================
      loadData();

      setTimeout(() => {
        if (typeof renderBreadcrumb === "function") {
          renderBreadcrumb();
        }
      }, 300);
    </script>
