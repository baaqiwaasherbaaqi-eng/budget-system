<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرونده پرسنلی</title>
  <link rel="stylesheet" href="/sidebar.css" />
  <script src="/sidebar.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <!-- Persian DatePicker -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-date@1.1.0/dist/persian-date.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css" />

  <style>
    * { box-sizing: border-box; }
    body { font-family: "Vazirmatn", Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; }

    /* ============ Person Header ============ */
    .person-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px 30px; border-radius: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .person-avatar { width: 70px; height: 70px; border-radius: 50%; background: rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: bold; flex-shrink: 0; }
    .person-info { flex: 1; }
    .person-info h1 { margin: 0 0 8px 0; font-size: 22px; }
    .person-info .meta { display: flex; gap: 15px; flex-wrap: wrap; font-size: 13px; opacity: 0.9; }
    .person-info .meta span { background: rgba(255, 255, 255, 0.15); padding: 4px 12px; border-radius: 12px; }
    .back-btn { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.3); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: background 0.2s; }
    .back-btn:hover { background: rgba(255, 255, 255, 0.3); }

    /* ============ Tabs ============ */
    .tabs-nav { display: flex; gap: 5px; background: white; padding: 8px; border-radius: 10px; margin-bottom: 20px; overflow-x: auto; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); }
    .tab-item { padding: 10px 18px; border-radius: 8px; cursor: pointer; font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 13px; color: #666; white-space: nowrap; transition: all 0.2s; display: flex; align-items: center; gap: 6px; border: none; background: transparent; }
    .tab-item:hover { background: #f0f2f5; color: #667eea; }
    .tab-item.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: bold; }

    /* ============ Tab Content ============ */
    .tab-content { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05); min-height: 400px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ============ Form ============ */
    .section-divider { margin: 25px 0 15px 0; padding-bottom: 8px; border-bottom: 2px solid #e9ecef; font-size: 14px; font-weight: bold; color: #667eea; display: flex; align-items: center; gap: 8px; }
    .section-divider:first-child { margin-top: 0; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; font-size: 13px; }
    .form-group label .required { color: #e74c3c; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 13px; background: white; transition: border-color 0.2s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #667eea; }
    .form-group textarea { resize: vertical; min-height: 70px; }

    /* ============ Actions ============ */
    .actions-bar { display: flex; gap: 10px; justify-content: flex-end; margin-top: 25px; padding-top: 20px; border-top: 1px solid #e9ecef; }
    .btn { padding: 12px 30px; border-radius: 8px; border: none; cursor: pointer; font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 14px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-save { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3); }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4); }
    .btn-save:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ============ Placeholder ============ */
    .placeholder { text-align: center; padding: 80px 20px; color: #999; }
    .placeholder .icon { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }
    .placeholder h3 { margin: 0 0 8px 0; color: #666; font-size: 16px; }
    .placeholder p { margin: 0; font-size: 13px; }

    /* ============ Loading ============ */
    .loading { text-align: center; padding: 60px 20px; color: #999; }
    .loading .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #e9ecef; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ Toast ============ */
    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); z-index: 10002; transition: transform 0.3s; font-family: "Vazirmatn", Tahoma, sans-serif; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { background: #28a745; }
    .toast.error { background: #dc3545; }

    /* ============ Dark Mode ============ */
    body.dark { background: #1a202c; color: #e2e8f0; }
    body.dark .tabs-nav, body.dark .tab-content { background: #2d3748; }
    body.dark .tab-item { color: #a0aec0; }
    body.dark .tab-item:hover { background: #4a5568; }
    body.dark .tab-item.active { color: white; }
    body.dark .section-divider { border-bottom-color: #4a5568; }
    body.dark .form-group label { color: #cbd5e0; }
    body.dark .form-group input, body.dark .form-group textarea, body.dark .form-group select { background: #1a202c; border-color: #4a5568; color: #e2e8f0; }
    body.dark .actions-bar { border-top-color: #4a5568; }

    /* ============ Responsive ============ */
    @media (max-width: 768px) {
      .person-header { padding: 15px 20px; }
      .person-info h1 { font-size: 18px; }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
      .tabs-nav { padding: 5px; }
      .tab-item { padding: 8px 12px; font-size: 12px; }
    }

    /* ============ Tasks ============ */
    .tasks-container { margin-bottom: 20px; }
    .task-item { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-right: 4px solid #667eea; transition: all 0.2s; }
    .task-item:hover { background: #eef1ff; }
    .task-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .task-row .form-group { margin-bottom: 0; }
    .task-remove-btn { background: #dc3545; color: white; border: none; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
    .task-remove-btn:hover { background: #c82333; transform: scale(1.05); }
    .add-task-btn { background: #17a2b8; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 13px; transition: all 0.2s; margin-bottom: 20px; }
    .add-task-btn:hover { background: #138496; transform: translateY(-1px); }
    .total-bar { background: #f8f9fa; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; border-right: 4px solid #667eea; display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .total-bar strong { font-size: 18px; }
    .info-banner { background: #e7f3ff; border-right: 4px solid #17a2b8; padding: 12px 18px; border-radius: 6px; margin-bottom: 20px; font-size: 13px; color: #0c5460; line-height: 1.7; }
    body.dark .task-item { background: #374151; }
    body.dark .task-item:hover { background: #4a5568; }
    body.dark .total-bar { background: #374151; color: #e2e8f0; }
    body.dark .info-banner { background: #1a202c; color: #90cdf4; }

    /* ============ Dependents ============ */
    .dependents-container { margin-bottom: 20px; }
    .dependent-item { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-right: 4px solid #28a745; transition: all 0.2s; }
    .dependent-item:hover { background: #eef9f0; }
    .dependent-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .dependent-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .dependent-icon { font-size: 20px; }
    .dependent-name { font-weight: bold; font-size: 15px; color: #333; }
    .dependent-badge { background: #28a745; color: white; padding: 3px 12px; border-radius: 12px; font-size: 11px; }
    .dependent-actions { display: flex; gap: 5px; }
    .dep-btn { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
    .dep-edit-btn { background: #ffc107; color: #333; }
    .dep-edit-btn:hover { background: #e0a800; transform: scale(1.05); }
    .dep-delete-btn { background: #dc3545; color: white; }
    .dep-delete-btn:hover { background: #c82333; transform: scale(1.05); }
    .dependent-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .info-row { display: flex; gap: 5px; font-size: 12px; }
    .info-label { color: #666; min-width: 80px; }
    .info-value { color: #333; font-weight: 500; }
    .dependent-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .badge-allowance { background: #fff3cd; color: #856404; padding: 4px 10px; border-radius: 12px; font-size: 11px; }
    .badge-insurance { background: #d1ecf1; color: #0c5460; padding: 4px 10px; border-radius: 12px; font-size: 11px; }
    .badge-disabled { background: #f8d7da; color: #721c24; padding: 4px 10px; border-radius: 12px; font-size: 11px; }
    .dependents-summary { background: #f8f9fa; border-radius: 8px; padding: 12px 18px; margin-bottom: 20px; font-size: 13px; display: flex; gap: 15px; flex-wrap: wrap; border-right: 4px solid #28a745; }
    .summary-item { color: #333; }

    /* Modal */
    .dependent-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 10001; padding: 20px; }
    .dependent-modal-overlay.open { display: flex; }
    .dependent-modal { background: white; border-radius: 12px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); animation: slideUp 0.2s; }
    .dependent-modal-header { padding: 20px 25px; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; }
    .dependent-modal-header h3 { margin: 0; font-size: 16px; color: #333; }
    .dep-modal-close { background: transparent; border: none; cursor: pointer; font-size: 20px; color: #999; width: 30px; height: 30px; border-radius: 6px; transition: all 0.2s; }
    .dep-modal-close:hover { background: #f0f2f5; color: #333; }
    .dependent-modal-body { padding: 25px; }
    .dependent-modal-footer { padding: 20px 25px; border-top: 1px solid #e9ecef; display: flex; justify-content: flex-end; gap: 10px; }
    .btn-lookup { background: #17a2b8; color: white; border: none; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: all 0.2s; flex-shrink: 0; }
    .btn-lookup:hover { background: #138496; transform: scale(1.05); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    body.dark .dependent-item { background: #374151; }
    body.dark .dependent-item:hover { background: #4a5568; }
    body.dark .dependent-name { color: #e2e8f0; }
    body.dark .info-label { color: #a0aec0; }
    body.dark .info-value { color: #e2e8f0; }
    body.dark .dependents-summary { background: #374151; color: #e2e8f0; }
    body.dark .dependent-modal { background: #2d3748; }
    body.dark .dependent-modal-header { border-bottom-color: #4a5568; }
    body.dark .dependent-modal-header h3 { color: #e2e8f0; }
    body.dark .dependent-modal-footer { border-top-color: #4a5568; }

    /* ============ Decrees ============ */
    .decrees-container { margin-bottom: 20px; }
    .decree-item { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-right: 4px solid #667eea; transition: all 0.2s; }
    .decree-item:hover { background: #eef1ff; }
    .decree-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
    .decree-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .decree-icon { font-size: 20px; }
    .decree-type { font-weight: bold; font-size: 15px; color: #333; }
    .decree-number { font-family: monospace; font-size: 11px; background: white; padding: 3px 10px; border-radius: 12px; color: #667eea; }
    .decree-status { color: white; padding: 3px 10px; border-radius: 12px; font-size: 11px; }
    .decree-actions { display: flex; gap: 5px; }
    .decree-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 10px; }
    .decree-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #e9ecef; flex-wrap: wrap; gap: 10px; }
    .decree-total { font-size: 13px; color: #333; }
    .decree-total strong { color: #28a745; font-size: 15px; }
    .decree-items-count { font-size: 12px; color: #667eea; }
    body.dark .decree-item { background: #374151; }
    body.dark .decree-item:hover { background: #4a5568; }
    body.dark .decree-type { color: #e2e8f0; }
    body.dark .decree-number { background: #1a202c; }
    body.dark .decree-footer { border-top-color: #4a5568; }
    body.dark .decree-total { color: #e2e8f0; }

    /* ============ Decree Items (داخل Modal) ============ */
    .decree-item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f8f9fa; border-radius: 6px; margin-bottom: 6px; gap: 10px; }
    .decree-item-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #333; flex: 1; }
    .decree-item-code { font-weight: bold; color: #667eea; font-family: monospace; min-width: 30px; }
    .decree-item-input { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .decree-item-input input { width: 150px; padding: 6px 10px; border: 1px solid #ddd; border-radius: 5px; font-family: "Vazirmatn", Tahoma, sans-serif; font-size: 13px; text-align: left; direction: ltr; }
    .decree-item-input input:focus { outline: none; border-color: #667eea; }
    .currency { font-size: 11px; color: #999; }
    .decree-total-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; border-radius: 8px; margin: 15px 0; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
    .decree-total-box strong { font-size: 22px; }
    body.dark .decree-item-row { background: #374151; }
    body.dark .decree-item-label { color: #e2e8f0; }
    body.dark .decree-item-input input { background: #1a202c; border-color: #4a5568; color: #e2e8f0; }

    /* ============ Task Cascade ============ */
    .task-cascade { margin-bottom: 20px; }
    .task-breadcrumb { background: #eef1ff; padding: 10px 15px; border-radius: 8px; font-size: 12px; color: #667eea; line-height: 1.8; direction: rtl; word-wrap: break-word; }
    .cascade-select { font-family: "Vazirmatn", Tahoma, sans-serif; width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; margin-bottom: 10px; }
    .cascade-select:focus { outline: none; border-color: #667eea; }
    body.dark .task-breadcrumb { background: #374151; color: #90cdf4; }
    body.dark .cascade-select { background: #1a202c; border-color: #4a5568; color: #e2e8f0; }
    .btn-choose-level { background: #28a745; color: white; border: none; width: 40px; height: 40px; border-radius: 6px; cursor: pointer; font-size: 18px; transition: all 0.2s; flex-shrink: 0; }
    .btn-choose-level:hover { background: #218838; transform: scale(1.05); }

    /* ============ Organizations ============ */
    .orgs-container { margin-bottom: 20px; }
    .org-item { background: #f8f9fa; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-right: 4px solid #6c757d; transition: all 0.2s; }
    .org-item.primary { border-right-color: #28a745; background: #f0f9f4; }
    .org-item:hover { background: #eef1ff; }
    .org-item-header { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .org-item-info { display: flex; align-items: center; gap: 12px; flex: 1; }
    .org-item-icon { font-size: 24px; flex-shrink: 0; }
    .org-item-title { font-size: 14px; font-weight: bold; color: #333; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .org-item-meta { font-size: 12px; color: #666; margin-top: 4px; }
    .org-item-dates { font-size: 11px; color: #999; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e0e0e0; }
    .primary-badge { background: #28a745; color: white; padding: 2px 10px; border-radius: 12px; font-size: 10px; }
    .org-item-actions { display: flex; gap: 5px; flex-shrink: 0; }

    /* User Status Card */
    .user-status-card { background: #f8f9fa; border-radius: 10px; padding: 20px; border-right: 4px solid #6c757d; }
    .user-status-card.success { background: #d4edda; border-right-color: #28a745; }
    .user-status-card.warning { background: #fff3cd; border-right-color: #ffc107; }
    .user-status-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 15px; font-weight: bold; }
    .user-status-icon { font-size: 22px; }
    .user-status-title { color: #333; }
    .user-status-info { font-size: 13px; color: #333; line-height: 1.8; }
    .user-status-warning { margin-top: 10px; padding: 8px 12px; background: rgba(220, 53, 69, 0.1); color: #dc3545; border-radius: 6px; font-size: 12px; }
    body.dark .org-item { background: #374151; }
    body.dark .org-item.primary { background: #2d4a3e; }
    body.dark .org-item:hover { background: #4a5568; }
    body.dark .org-item-title { color: #e2e8f0; }
    body.dark .user-status-card { background: #2d3748; }
    body.dark .user-status-card.success { background: #2d4a3e; }
    body.dark .user-status-card.warning { background: #4a3f1e; }
    body.dark .user-status-title { color: #e2e8f0; }
    body.dark .user-status-info { color: #e2e8f0; }

    /* ============ استایل فرم اداری حکم ============ */
    .paper-form { background: white; color: black; width: 100%; max-width: 850px; margin: 0 auto; font-family: 'Vazirmatn', Tahoma, sans-serif; }
    .paper-table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: right; }
    .paper-table th, .paper-table td { border: 1px solid #333; padding: 6px 10px; vertical-align: middle; }
    .paper-table td label { font-weight: bold; font-size: 11px; color: #333; margin: 0; display: block; margin-bottom: 2px; }
    .paper-table input[type="text"], .paper-table input[type="number"] { width: 100%; border: none; border-bottom: 1px dashed #999; background: transparent; padding: 2px 4px; font-family: inherit; font-size: 12px; color: #000; outline: none; }
    .paper-table input[type="text"]:focus, .paper-table input[type="number"]:focus { border-bottom: 1px solid #667eea; background: #f0f4ff; }
    .paper-table select { width: 100%; border: none; border-bottom: 1px dashed #999; background: transparent; font-family: inherit; font-size: 12px; padding: 2px; outline: none; color: #000; }
    .paper-table .bg-gray { background: #f0f0f0; font-weight: bold; }

    /* ============ مودال چاپ حکم ============ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); display: none; align-items: center; justify-content: center; z-index: 10005; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .print-modal-content { background: white; border-radius: 12px; max-width: 900px; width: 100%; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); }
    .print-modal-header { padding: 15px 20px; border-bottom: 1px solid #e9ecef; display: flex; justify-content: space-between; align-items: center; }
    .print-modal-body { padding: 20px; overflow-y: auto; background: #e9ecef; flex: 1; }
    
    @media print {
        body * { visibility: hidden; }
        #print-decree-modal, #print-decree-modal * { visibility: visible; }
        #print-decree-modal { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; background: white; display: block !important; }
        .print-modal-content { box-shadow: none; max-width: 100%; border: none; max-height: none; }
        .print-modal-header { display: none; }
        .print-modal-body { padding: 0; overflow: visible; background: white; }
        @page { size: A4; margin: 10mm; }
    }
  </style>
</head>

<body>
  <div class="container" id="main-container">
    <div class="loading">
      <div class="spinner"></div>
      <div>در حال بارگذاری...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Modal چاپ حکم -->
  <div class="modal-overlay" id="print-decree-modal">
    <div class="print-modal-content">
      <div class="print-modal-header">
        <h3 style="margin:0; font-size:16px;">پیش‌نمایش حکم کارگزینی</h3>
        <div>
          <button class="btn btn-save" onclick="window.print()" style="background: #28a745; color: white; padding: 8px 16px; font-size: 13px;">🖨️ چاپ نهایی</button>
          <button class="btn btn-cancel" onclick="closePrintModal()" style="background: #e9ecef; color: #333; padding: 8px 16px; font-size: 13px;">بستن</button>
        </div>
      </div>
      <div class="print-modal-body">
        <div id="printable-decree-content" style="font-family: 'Vazirmatn', Tahoma, sans-serif;"></div>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>

  <script>
    let personOrganizations = [];
    let userStatus = null;
    let allOrganizations = [];

    if (!isTokenValid()) {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      window.location.href = "/login.html";
    }

    const token = localStorage.getItem("token");
    const currentUser = JSON.parse(localStorage.getItem("user") || "{}");

    let personId = null;
    let person = null;
    let employee = null;
    let decreeTypes = [];
    let organizations = [];
    let datePickersInitialized = false;
    let employeeTasks = [];
    let operationalItems = [];
    let dependents = [];
    let decrees = [];
    let lockedTaskType = null;

    function showToast(message, type = "success") {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove("show"), 3000);
    }

    function getPersonIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function toPersianDate(dateStr) {
      if (!dateStr) return "";
      return toPersianNumbers(dateStr);
    }

    function cleanDate(value) {
      if (!value) return null;
      let normalized = toEnglishNumbers(value.toString());
      const trimmed = normalized.trim();
      if (!trimmed) return null;
      if (trimmed.includes("/")) {
        const match = trimmed.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
        if (match) {
          return `${match[1]}/${match[2].padStart(2, "0")}/${match[3].padStart(2, "0")}`;
        }
      }
      const months = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
      const parts = trimmed.split(/\s+/);
      for (let i = 0; i < parts.length; i++) {
        const monthIndex = months.indexOf(parts[i]);
        if (monthIndex >= 0) {
          const day = parts[i - 1];
          const year = parts[i + 1];
          if (day && year && /^\d+$/.test(day) && /^\d+$/.test(year)) {
            const m = (monthIndex + 1).toString().padStart(2, "0");
            const d = day.padStart(2, "0");
            return `${year}/${m}/${d}`;
          }
        }
      }
      return null;
    }

    async function loadData() {
      personId = getPersonIdFromUrl();
      if (!personId) {
        document.getElementById("main-container").innerHTML = `<div class="placeholder"><div class="icon">⚠️</div><h3>شناسه شخص مشخص نشده</h3><p>لطفاً از صفحه اشخاص یک شخص انتخاب کنید</p></div>`;
        return;
      }

      try {
        const res = await fetch(`/api/employees/${personId}`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error("خطا در دریافت اطلاعات");
        const data = await res.json();
        person = data.person;
        employee = data.employee;

        const decreeRes = await fetch("/api/base-data?section=decree_type", { headers: { Authorization: `Bearer ${token}` } });
        decreeTypes = await decreeRes.json();

        const orgRes = await fetch("/api/base-data?section=organization", { headers: { Authorization: `Bearer ${token}` } });
        organizations = await orgRes.json();

        const tasksRes = await fetch(`/api/employees/${personId}/tasks`, { headers: { Authorization: `Bearer ${token}` } });
        employeeTasks = await tasksRes.json();
        detectLockedType();

        const opRes = await fetch("/api/operational-tree", { headers: { Authorization: `Bearer ${token}` } });
        operationalItems = await opRes.json();

        const depsRes = await fetch(`/api/employees/${personId}/dependents`, { headers: { Authorization: `Bearer ${token}` } });
        dependents = await depsRes.json();

        const decreesRes = await fetch(`/api/employees/${personId}/decrees`, { headers: { Authorization: `Bearer ${token}` } });
        decrees = await decreesRes.json();

        const orgsRes = await fetch(`/api/persons/${personId}/organizations`, { headers: { Authorization: `Bearer ${token}` } });
        personOrganizations = await orgsRes.json();

        const userRes = await fetch(`/api/persons/${personId}/user-status`, { headers: { Authorization: `Bearer ${token}` } });
        userStatus = await userRes.json();

        const allOrgsRes = await fetch("/api/base-data?section=organization", { headers: { Authorization: `Bearer ${token}` } });
        allOrganizations = await allOrgsRes.json();

        renderPage();
        setTimeout(initCascade, 200);
        setTimeout(initDatePickers, 200);
        setTimeout(initBasicDatePickers, 200);
      } catch (error) {
        console.error("Load error:", error);
        document.getElementById("main-container").innerHTML = `<div class="placeholder"><div class="icon">❌</div><h3>${error.message}</h3><p><a href="/persons.html" style="color: #667eea;">بازگشت به اشخاص</a></p></div>`;
      }
    }

    function renderPage() {
      const typeLabels = { employee: "کارکنان", citizen: "شهروندان", legal: "اشخاص حقوقی", foreigner: "خارج شهروندان" };
      const initial = person.full_name ? person.full_name.charAt(0) : "?";

      const html = `
        <div class="person-header">
          <div class="person-avatar">${initial}</div>
          <div class="person-info">
            <h1>${person.full_name}</h1>
            <div class="meta">
              <span>🆔 کد ملی: ${person.national_id || "—"}</span>
              <span>📋 کد: ${person.code}</span>
              <span>👥 ${typeLabels[person.person_type] || person.person_type}</span>
            </div>
          </div>
          <a href="/persons.html" class="back-btn">↩️ بازگشت به اشخاص</a>
        </div>

        <div class="tabs-nav">
          <button class="tab-item active" onclick="switchTab('basic', this)">📋 اطلاعات پایه</button>
          <button class="tab-item" onclick="switchTab('employment', this)">💼 اطلاعات استخدامی</button>
          <button class="tab-item" onclick="switchTab('decrees', this)">📋 احکام کارگزینی</button>
          <button class="tab-item" onclick="switchTab('dependents', this)">👨‍👩‍👧 افراد تحت تکفل</button>
          <button class="tab-item" onclick="switchTab('organization', this)">🏢 واحد سازمانی</button>
          <button class="tab-item" onclick="switchTab('tasks', this)">🎯 وظایف</button>
        </div>

        <div class="tab-content">
          <div class="tab-panel active" id="panel-basic">${renderBasicTab()}</div>
          <div class="tab-panel" id="panel-employment">${renderEmploymentTab()}</div>
          <div class="tab-panel" id="panel-decrees">${renderDecreesTab()}</div>
          <div class="tab-panel" id="panel-dependents">${renderDependentsTab()}</div>
          <div class="tab-panel" id="panel-organization">${renderOrganizationTab()}</div>
          <div class="tab-panel" id="panel-tasks">${renderTasksTab()}</div>
        </div>
      `;

      document.getElementById("main-container").innerHTML = html;

      const breadcrumbHTML = `
        <div class="breadcrumb">
          <a href="/dashboard.html" class="breadcrumb-item"><span>🏠</span><span>داشبورد</span></a>
          <span class="breadcrumb-separator">◄</span>
          <a href="/base-info.html" class="breadcrumb-item"><span>📂</span><span>اطلاعات پایه</span></a>
          <span class="breadcrumb-separator">◄</span>
          <a href="/persons.html" class="breadcrumb-item"><span>👥</span><span>اشخاص</span></a>
          <span class="breadcrumb-separator">◄</span>
          <span class="breadcrumb-item current"><span>📁</span><span>پرونده پرسنلی</span></span>
        </div>
      `;
      document.querySelector(".person-header").insertAdjacentHTML("beforebegin", breadcrumbHTML);

      datePickersInitialized = false;
      setTimeout(initDatePickers, 200);
    }

    function renderBasicTab() {
      return `
        <div class="section-divider">📋 اطلاعات سجلی</div>
        <div class="form-row">
          <div class="form-group"><label>کد ملی <span class="required">*</span></label><input type="text" id="basic-national-id" value="${person.national_id || ""}" maxlength="10" dir="ltr" /></div>
          <div class="form-group"><label>شماره شناسنامه</label><input type="text" id="basic-id-number" value="${person.id_number || ""}" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>نام <span class="required">*</span></label><input type="text" id="basic-first-name" value="${person.first_name || ""}" /></div>
          <div class="form-group"><label>نام خانوادگی <span class="required">*</span></label><input type="text" id="basic-last-name" value="${person.last_name || ""}" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>نام پدر</label><input type="text" id="basic-father-name" value="${person.father_name || ""}" /></div>
          <div class="form-group"><label>نام مادر</label><input type="text" id="basic-mother-name" value="${person.mother_name || ""}" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>تاریخ تولد</label><input type="text" id="basic-birth-date" value="${toPersianDate(person.birth_date_shamsi)}" placeholder="۱۳۷۰/۰۱/۰۱" /></div>
          <div class="form-group"><label>محل تولد</label><input type="text" id="basic-birth-place" value="${person.birth_place || ""}" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>جنسیت</label><select id="basic-gender"><option value="">— انتخاب کنید —</option><option value="male" ${person.gender === "male" ? "selected" : ""}>مرد</option><option value="female" ${person.gender === "female" ? "selected" : ""}>زن</option></select></div>
          <div class="form-group"><label>تابعیت</label><input type="text" id="basic-nationality" value="${person.nationality || "ایرانی"}" /></div>
        </div>
        <div class="section-divider">📞 اطلاعات تماس</div>
        <div class="form-row">
          <div class="form-group"><label>موبایل</label><input type="text" id="basic-mobile" value="${person.mobile || ""}" maxlength="11" dir="ltr" /></div>
          <div class="form-group"><label>تلفن ثابت</label><input type="text" id="basic-phone" value="${person.phone || ""}" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>کد پستی</label><input type="text" id="basic-postal-code" value="${person.postal_code || ""}" maxlength="10" /></div>
          <div class="form-group"><label>ایمیل</label><input type="email" id="basic-email" value="${person.email || ""}" dir="ltr" /></div>
        </div>
        <div class="form-group"><label>آدرس</label><textarea id="basic-address">${person.address || ""}</textarea></div>
        <div class="section-divider">🏦 اطلاعات بانکی</div>
        <div class="form-row">
          <div class="form-group"><label>نام بانک</label><input type="text" id="basic-bank-name" value="${person.bank_name || ""}" /></div>
          <div class="form-group"><label>شماره حساب</label><input type="text" id="basic-bank-account" value="${person.bank_account || ""}" dir="ltr" /></div>
        </div>
        <div class="form-group"><label>شبا (IR)</label><input type="text" id="basic-iban" value="${person.iban || ""}" dir="ltr" placeholder="IR..." /></div>
        <div class="actions-bar"><button class="btn btn-save" id="btn-save-basic" onclick="saveBasicInfo()">💾 ذخیره اطلاعات پایه</button></div>
      `;
    }

    async function saveBasicInfo() {
      const btn = document.getElementById("btn-save-basic");
      btn.disabled = true; btn.textContent = "⏳ در حال ذخیره...";
      try {
        const firstName = document.getElementById("basic-first-name").value.trim();
        const lastName = document.getElementById("basic-last-name").value.trim();
        const fullName = `${firstName} ${lastName}`.trim();
        if (!fullName) throw new Error("نام و نام خانوادگی الزامی است");

        const data = {
          full_name: fullName, first_name: firstName || null, last_name: lastName || null,
          father_name: document.getElementById("basic-father-name").value.trim() || null,
          mother_name: document.getElementById("basic-mother-name").value.trim() || null,
          national_id: document.getElementById("basic-national-id").value.trim() || null,
          id_number: document.getElementById("basic-id-number").value.trim() || null,
          birth_date_shamsi: cleanDate(document.getElementById("basic-birth-date").value),
          birth_place: document.getElementById("basic-birth-place").value.trim() || null,
          gender: document.getElementById("basic-gender").value || null,
          nationality: document.getElementById("basic-nationality").value.trim() || "ایرانی",
          mobile: document.getElementById("basic-mobile").value.trim() || null,
          phone: document.getElementById("basic-phone").value.trim() || null,
          address: document.getElementById("basic-address").value.trim() || null,
          postal_code: document.getElementById("basic-postal-code").value.trim() || null,
          email: document.getElementById("basic-email").value.trim() || null,
          bank_name: document.getElementById("basic-bank-name").value.trim() || null,
          bank_account: document.getElementById("basic-bank-account").value.trim() || null,
          iban: document.getElementById("basic-iban").value.trim() || null,
          is_active: person.is_active,
        };

        const res = await fetch(`/api/persons/${personId}`, { method: "PUT", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(data) });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "خطا");

        showToast("اطلاعات پایه با موفقیت ذخیره شد");
        const res2 = await fetch(`/api/employees/${personId}`, { headers: { Authorization: `Bearer ${token}` } });
        const data2 = await res2.json();
        person = data2.person;

        const panel = document.getElementById("panel-basic");
        if (panel) { panel.innerHTML = renderBasicTab(); setTimeout(initBasicDatePickers, 100); }
      } catch (error) { showToast(error.message, "error"); } finally { btn.disabled = false; btn.textContent = "💾 ذخیره اطلاعات پایه"; }
    }

    function initBasicDatePickers() {
      const el = document.getElementById("basic-birth-date");
      if (!el) return;
      try { $("#basic-birth-date").persianDatepicker("destroy"); } catch (e) { }
      $("#basic-birth-date").persianDatepicker({ format: "YYYY/MM/DD", autoClose: true, persianDigit: true, initialValue: !!el.value });
    }

    function renderEmploymentTab() {
      const e = employee || {};
      let decreeOptions = '<option value="">— انتخاب کنید —</option>';
      decreeTypes.forEach((d) => {
        const selected = e.decree_type === d.code ? "selected" : "";
        decreeOptions += `<option value="${d.code}" ${selected}>${d.title}</option>`;
      });
      let organizationOptions = '<option value="">— انتخاب کنید —</option>';
      organizations.forEach((org) => {
        const selected = e.department === org.title ? "selected" : "";
        organizationOptions += `<option value="${org.title}" ${selected}>${org.title}</option>`;
      });

      return `
        <div class="section-divider">💼 اطلاعات قرارداد</div>
        <div class="form-row">
          <div class="form-group"><label>نوع قرارداد <span class="required">*</span></label><select id="input-contract-type"><option value="">— انتخاب کنید —</option><option value="worker" ${e.contract_type === "worker" ? "selected" : ""}>کارگر</option><option value="employee" ${e.contract_type === "employee" ? "selected" : ""}>کارمند</option></select></div>
          <div class="form-group"><label>تاریخ استخدام</label><input type="text" id="input-hire-date" value="${toPersianDate(e.hire_date_shamsi)}" placeholder="۱۴۰۰/۰۱/۰۱" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>تاریخ شروع قرارداد</label><input type="text" id="input-contract-start" value="${toPersianDate(e.contract_start_shamsi)}" placeholder="۱۴۰۰/۰۱/۰۱" /></div>
          <div class="form-group"><label>تاریخ پایان قرارداد</label><input type="text" id="input-contract-end" value="${toPersianDate(e.contract_end_shamsi)}" placeholder="اختیاری" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>نوع حکم</label><select id="input-decree-type">${decreeOptions}</select></div>
          <div class="form-group"><label>نوع استخدام</label><input type="text" id="input-employment-type" value="${e.employment_type || ""}" placeholder="مثلاً رسمی" /></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>سمت</label><input type="text" id="input-position" value="${e.position || ""}" /></div>
          <div class="form-group"><label>واحد سازمانی</label><select id="input-department">${organizationOptions}</select></div>
        </div>

          <div class="form-group"><label>تاریخ شروع به کار در واحد فعلی</label><input type="text" id="input-unit-start-date" value="${toPersianDate(e.unit_start_shamsi)}" placeholder="۱۴۰۰/۰۱/۰۱" /></div>
          <div class="form-group"><label>شماره پرسنلی</label><input type="text" id="input-personnel-code" value="${e.personnel_code || ""}" dir="ltr" /></div>
        </div>
        <div class="section-divider">📊 سابقه</div>
        <div class="form-row">
          <div class="form-group"><label>سابقه سنوات (سال)</label><input type="number" id="input-years-service" value="${e.years_of_service || 0}" min="0" /></div>
          <div class="form-group"><label>سابقه بیمه (ماه)</label><input type="number" id="input-insurance-months" value="${e.insurance_history_months || 0}" min="0" /></div>
        </div>
        <div class="form-group"><label>شماره بیمه</label><input type="text" id="input-insurance-number" value="${e.insurance_number || ""}" dir="ltr" /></div>
        <div class="section-divider">🎓 مدرک تحصیلی</div>
        <div class="form-row">
          <div class="form-group"><label>مقطع</label><select id="input-education-level"><option value="">— انتخاب کنید —</option><option value="زیر دیپلم" ${e.education_level === "زیر دیپلم" ? "selected" : ""}>زیر دیپلم</option><option value="دیپلم" ${e.education_level === "دیپلم" ? "selected" : ""}>دیپلم</option><option value="کاردانی" ${e.education_level === "کاردانی" ? "selected" : ""}>کاردانی</option><option value="کارشناسی" ${e.education_level === "کارشناسی" ? "selected" : ""}>کارشناسی</option><option value="کارشناسی ارشد" ${e.education_level === "کارشناسی ارشد" ? "selected" : ""}>کارشناسی ارشد</option><option value="دکتری" ${e.education_level === "دکتری" ? "selected" : ""}>دکتری</option></select></div>
          <div class="form-group"><label>رشته تحصیلی</label><input type="text" id="input-education-field" value="${e.education_field || ""}" /></div>

        <div class="form-row">
          <div class="form-group"><label>دانشگاه</label><input type="text" id="input-education-university" value="${e.education_university || ""}" /></div>
          <div class="form-group"><label>سال فارغ‌التحصیلی</label><input type="text" id="input-education-year" value="${e.education_year_shamsi || ""}" /></div>
        </div>
        <div class="section-divider">🎯 تخصص و تجربه</div>
        <div class="form-row">
          <div class="form-group"><label>سال‌های تجربه</label><input type="number" id="input-experience-years" value="${e.experience_years || 0}" min="0" /></div>
          <div class="form-group"><label>تخصص‌ها (با کاما جدا کنید)</label><input type="text" id="input-specialties" value="${e.specialties || ""}" placeholder="مثلاً: حسابداری، بودجه، مالیات" /></div>
        </div>
        <div class="form-group"><label>شرح تجربه</label><textarea id="input-experience-description">${e.experience_description || ""}</textarea></div>
        <div class="section-divider">🎂 روز مناسبتی</div>
        <div class="form-row">
          <div class="form-group"><label>تاریخ تولد (شمسی)</label><input type="text" id="input-birthday" value="${toPersianDate(e.birthday_shamsi || person.birth_date_shamsi)}" placeholder="۱۳۷۰/۰۱/۰۱" /></div>
          <div class="form-group"><label>سایر مناسبت‌ها (تاریخ)</label><input type="text" id="input-other-occasion-date" value="${toPersianDate(e.other_occasion_shamsi)}" placeholder="اختیاری" /></div>
        </div>
        <div class="form-group"><label>عنوان سایر مناسبت</label><input type="text" id="input-other-occasion-title" value="${e.other_occasion_title || ""}" /></div>
        <div class="section-divider">📝 یادداشت</div>
        <div class="form-group"><label>یادداشت</label><textarea id="input-notes">${e.notes || ""}</textarea></div>
        <div class="actions-bar"><button class="btn btn-save" id="btn-save-employment" onclick="saveEmployment()">💾 ذخیره اطلاعات استخدامی</button></div>
      `;
    }

    let taskLevels = [];
    function renderTasksTab() {
      const totalPercentage = employeeTasks.reduce((sum, t) => sum + (t.percentage || 0), 0);
      let totalColor = "#28a745";
      if (totalPercentage > 100) totalColor = "#dc3545";
      else if (totalPercentage < 100) totalColor = "#fd7e14";
      let tasksHtml = "";
      if (employeeTasks.length === 0) {
        tasksHtml = `<div style="text-align:center; padding:30px; color:#999;">هنوز وظیفه‌ای ثبت نشده</div>`;
      } else {
        employeeTasks.forEach((task, index) => {
          tasksHtml += `
            <div class="task-item" data-index="${index}">
              <div class="task-row" style="align-items: flex-start;">
                <div class="form-group" style="flex:1;"><label>وظیفه</label><div class="task-breadcrumb">${task.breadcrumb || task.task_title || "—"}</div></div>
                <div class="form-group" style="flex:0.5;"><label>درصد</label><input type="number" class="task-percentage" min="0" max="100" value="${task.percentage || 0}" onchange="onPercentageChange(${index}, this.value)" /></div>

                <div class="form-group"><label>تاریخ پایان</label><input type="text" id="org-end-date" value="${po?.end_date_shamsi ? toPersianNumbers(po.end_date_shamsi) : ""}" placeholder="اختیاری" /></div>

    function closeOrgModal() { const modal = document.getElementById("org-modal"); if (modal) modal.remove(); }

    async function saveOrg(poId) {
      const btn = document.getElementById("btn-save-org");
      btn.disabled = true; btn.textContent = "⏳ در حال ذخیره...";
      try {
        const organizationId = document.getElementById("org-organization-id").value;
        if (!organizationId) throw new Error("سازمان الزامی است");
        const data = {
          id: poId || null, organization_id: parseInt(organizationId),
          position_id: document.getElementById('org-position-id').value ? parseInt(document.getElementById('org-position-id').value) : null,
          role: document.getElementById('org-role').value.trim() || null,
          is_primary: document.getElementById('org-is-primary').value === '1',
          start_date_shamsi: cleanDate(document.getElementById('org-start-date').value),
          end_date_shamsi: cleanDate(document.getElementById('org-end-date').value),
          notes: document.getElementById('org-notes').value.trim() || null,
        };
        const res = await fetch(`/api/persons/${personId}/organizations`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(data) });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "خطا");
        showToast(poId ? "با موفقیت ویرایش شد" : "با موفقیت ثبت شد");
        closeOrgModal();
        await reloadOrgData();
      } catch (error) { showToast(error.message, "error"); } finally { btn.disabled = false; btn.textContent = "💾 ذخیره"; }
    }

    async function deleteOrg(poId) {
      if (!confirm("مطمئن هستید این سازمان حذف شود؟")) return;
      try {
        const res = await fetch(`/api/person-organizations/${poId}`, { method: "DELETE", headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error("خطا در حذف");
        showToast("با موفقیت حذف شد");
        await reloadOrgData();
      } catch (error) { showToast(error.message, "error"); }
    }

    async function reloadOrgData() {
      try {
        const [orgsRes, userRes] = await Promise.all([
          fetch(`/api/persons/${personId}/organizations`, { headers: { Authorization: `Bearer ${token}` } }),
          fetch(`/api/persons/${personId}/user-status`, { headers: { Authorization: `Bearer ${token}` } }),
        ]);
        personOrganizations = await orgsRes.json();
        userStatus = await userRes.json();
        const panel = document.getElementById("panel-organization");

    async function createUserForPerson() {
      if (!confirm("آیا مطمئن هستید؟\n\nنام کاربری بر اساس کد ملی ساخته می‌شود و رمز عبور به موبایل شخص ارسال می‌شود.")) return;
      try {
        const res = await fetch(`/api/persons/${personId}/create-user`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify({}) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "خطا");
        alert(`✅ کاربر با موفقیت ساخته شد.\n\nنام کاربری: ${data.username}\nرمز عبور (mock): ${data.temp_password}\nنقش: ${data.role}\n\n⚠️ رمز عبور به موبایل ${data.mobile} ارسال شد.`);

    let cascadeState = { levels: [], selectedTask: null };
    async function initCascade() {
      cascadeState = { levels: [], selectedTask: null };
      await loadCascadeLevel(null, 0);
      renderCascade();
    }

    function detectLockedType() {
      if (employeeTasks.length > 0) {
        const firstType = employeeTasks[0].task_type;
        if (firstType) lockedTaskType = firstType;
      } else lockedTaskType = null;
    }

    async function loadCascadeLevel(parentId, level) {
      try {
        const url = parentId ? `/api/operational-children?parent_id=${parentId}` : `/api/operational-children?parent_id=null`;
        const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
        const options = await res.json();
        cascadeState.levels[level] = { parentId: parentId, selected: null, options: options };
        cascadeState.levels = cascadeState.levels.slice(0, level + 1);
      } catch (error) { console.error("Load cascade level error:", error); }
    }

    async function onCascadeChange(level, value) {
      const optionId = value ? parseInt(value) : null;
      cascadeState.levels[level].selected = optionId;
      if (optionId) {
        const opt = cascadeState.levels[level].options.find((o) => o.id === optionId);
        cascadeState.selectedTask = opt;
        await loadCascadeLevel(optionId, level + 1);
      } else {
        cascadeState.selectedTask = null;
        cascadeState.levels = cascadeState.levels.slice(0, level + 1);
      }
      renderCascade();
    }

    function renderCascade() {
      const container = document.getElementById("cascade-container");
      if (!container) return;
      const typeLabels = { mission: "مأموریت", program: "برنامه", service: "خدمت", plan: "طرح", activity: "فعالیت", project: "پروژه" };
      const typeIcons = { mission: "🎯", program: "📋", service: "⚙️", plan: "📐", activity: "🔧", project: "🏗️", project_capital: "🏗️", project_financial: "💰" };
      let html = "";
      cascadeState.levels.forEach((levelData, levelIndex) => {
        if (!levelData) return;
        if (levelData.options.length === 0) return;
        if (lockedTaskType && levelIndex > 0) {
          const optionTypes = [...new Set(levelData.options.map((o) => o.type))];
          if (!optionTypes.includes(lockedTaskType)) return;
        }
        const levelNum = levelIndex + 1;
        const levelLabel = levelIndex === 0 ? "سطح ۱ - مأموریت" : `سطح ${toPersianNumbers(levelNum)}`;
        const isSelected = levelData.selected !== null;
        const isLastSelected = isSelected && (levelIndex === cascadeState.levels.length - 2 || !cascadeState.levels[levelIndex + 1] || cascadeState.levels[levelIndex + 1].selected === null);
        html += `
          <div class="form-group" style="position:relative;">
            <label>${levelLabel} ${isSelected ? '<span style="color:#28a745;font-size:11px;">✅</span>' : ""} ${isLastSelected ? '<span style="color:#667eea;font-size:11px;margin-right:5px;">(این سطح می‌تواند وظیفه باشد)</span>' : ""}</label>
            <div style="display:flex; gap:8px;">
              <select class="cascade-select" onchange="onCascadeChange(${levelIndex}, this.value)" style="flex:1;">
                <option value="">— انتخاب کنید —</option>
                ${levelData.options.map((opt) => `<option value="${opt.id}" ${levelData.selected === opt.id ? "selected" : ""}>${typeIcons[opt.type] || "📄"} ${opt.code} - ${opt.title} (${typeLabels[opt.type] || opt.type})</option>`).join("")}
              </select>
              ${isLastSelected ? `<button class="btn-choose-level" onclick="chooseThisLevelAsTask(${levelIndex})" title="این سطح را به عنوان وظیفه انتخاب کن">✅</button>` : ""}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function addTaskFromCascade() {
      if (!cascadeState.selectedTask) { showToast("لطفاً حداقل یک سطح انتخاب کنید", "error"); return; }
      const percentage = parseInt(document.getElementById("new-task-percentage").value) || 0;
      const notes = document.getElementById("new-task-notes").value.trim() || "";
      if (percentage <= 0) { showToast("درصد زمانی الزامی است", "error"); return; }
      if (lockedTaskType && cascadeState.selectedTask.type !== lockedTaskType) {
        const typeLabels = { mission: "مأموریت", program: "برنامه", service: "خدمت", plan: "طرح", activity: "فعالیت", project: "پروژه" };
        showToast(`همه وظایف باید در سطح «${typeLabels[lockedTaskType]}» باشند. سطح فعلی انتخاب: «${typeLabels[cascadeState.selectedTask.type]}»`, "error");
        return;
      }
      if (!lockedTaskType && employeeTasks.length === 0) lockedTaskType = cascadeState.selectedTask.type;
      const breadcrumbParts = [];
      cascadeState.levels.forEach((levelData) => {
        if (levelData && levelData.selected) {
          const opt = levelData.options.find((o) => o.id === levelData.selected);
          if (opt) breadcrumbParts.push(`${opt.code} - ${opt.title}`);
        }
      });
      const task = { task_id: cascadeState.selectedTask.id, task_type: cascadeState.selectedTask.type, task_title: cascadeState.selectedTask.title, breadcrumb: breadcrumbParts.join(" → "), percentage: percentage, notes: notes };
      employeeTasks.push(task);
      document.getElementById("new-task-percentage").value = 0;
      document.getElementById("new-task-notes").value = "";
      initCascade();
      const panel = document.getElementById("panel-tasks");
      if (panel) panel.innerHTML = renderTasksTab();
      setTimeout(initCascade, 100);
    }

    function chooseThisLevelAsTask(levelIndex) {
      const levelData = cascadeState.levels[levelIndex];
      if (!levelData || !levelData.selected) { showToast("لطفاً ابتدا یک گزینه انتخاب کنید", "error"); return; }
      const opt = levelData.options.find((o) => o.id === levelData.selected);
      if (!opt) return;
      cascadeState.selectedTask = opt;
      addTaskFromCascade();
    }

    function closeDecreeModal() {

    async function onDecreeTypeChange() {
        const type = document.getElementById("decree-type-select").value;
        currentDecreeType = type;
        if (!type) {
            currentDecreeItems = [];
            renderDecreeItems();
            return;
        }
        await loadDecreeItems(type);
    }

    async function loadDecreeItems(decreeType) {
      try {
        const res = await fetch(`/api/decree-items?decree_type=${decreeType}`, { headers: { Authorization: `Bearer ${token}` } });
        const templateItems = await res.json();
        const merged = templateItems.map((t) => {
          const existing = currentDecreeItems.find((ci) => ci.code === t.code);
          return { code: t.code, title: t.title, amount: existing ? existing.amount : 0 };
        });
        currentDecreeItems = merged;
        renderDecreeItems();
      } catch (error) { console.error("Load items error:", error); }
    }

    function renderDecreeItems() {
      const container = document.getElementById("decree-items-container");
      if (!container) return;
      if (currentDecreeItems.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:20px; color:#999;">آیتمی برای این نوع حکم یافت نشد</div>`;
        return;
      }
      let html = `<table style="width: 100%; border-collapse: collapse;">`;
      currentDecreeItems.forEach((item, index) => {
        html += `
        <tr>
          <td style="border-bottom: 1px solid #ddd; padding: 5px; font-size: 12px;">${item.code}) ${item.title}</td>
          <td style="border-bottom: 1px solid #ddd; padding: 5px; width: 120px;">
            <input type="text" class="amount-input" value="${item.amount ? formatAmount(item.amount) : ""}" placeholder="۰" oninput="onDecreeAmountChange(${index}, this)" style="text-align: left; direction: ltr;" />
          </td>
        </tr>
      `;
      });
      html += `</table>`;
      container.innerHTML = html;
      container.querySelectorAll(".amount-input").forEach((input) => {
        input.addEventListener("input", function () {
          let value = toEnglishNumbers(this.value);
          value = value.replace(/,/g, "").replace(/[^\d]/g, "");
          if (value === "") { this.value = ""; return; }
          this.value = toPersianNumbers(value.replace(/\B(?=(\d{3})+(?!\d))/g, ","));
        });
      });
      updateDecreeTotal();
    }

    function onDecreeAmountChange(index, input) {
      let value = toEnglishNumbers(input.value);
      value = value.replace(/,/g, "").replace(/[^\d]/g, "");
      currentDecreeItems[index].amount = value === "" ? 0 : parseInt(value);
      updateDecreeTotal();
    }

    function updateDecreeTotal() {
      const total = currentDecreeItems.reduce((sum, item) => sum + (item.amount || 0), 0);
      const totalEl = document.getElementById("decree-total-amount");
      if (totalEl) totalEl.textContent = formatAmount(total);
      return total;
    }

    function renderOperationalOptions(selectedId) {
      const typeLabels = { mission: "🎯", program: "📋", service: "⚙️", plan: "📐", activity: "🔧", project: "🏗️" };
      let html = '<option value="">— انتخاب کنید —</option>';
      operationalItems.forEach((item) => {
        const icon = typeLabels[item.type] || "📄";
        const indent = "　".repeat(item.level);
        const selected = item.id == selectedId ? "selected" : "";
        html += `<option value="${item.id}" data-type="${item.type}" data-title="${item.title}" ${selected}>${indent}${icon} ${item.code} - ${item.title}</option>`;

      employeeTasks.splice(index, 1);

    function onTaskChange(index, taskId) {
      if (!taskId) { employeeTasks[index].task_id = ""; employeeTasks[index].task_type = ""; employeeTasks[index].task_title = ""; return; }
      const taskIdNum = parseInt(taskId);
      const isDuplicate = employeeTasks.some((t, i) => i !== index && t.task_id && parseInt(t.task_id) === taskIdNum);
      if (isDuplicate) {
        showToast("این وظیفه قبلاً انتخاب شده است", "error");
        const selectEl = document.querySelector(`.task-item[data-index="${index}"] .task-select`);
        if (selectEl) selectEl.value = "";
        return;
      }
      const selectedOption = document.querySelector(`.task-item[data-index="${index}"] .task-select option:checked`);
      if (selectedOption) { employeeTasks[index].task_id = taskIdNum; employeeTasks[index].task_type = selectedOption.dataset.type || ""; employeeTasks[index].task_title = selectedOption.dataset.title || ""; }
      const panel = document.getElementById("panel-tasks");
      if (panel) { panel.innerHTML = renderTasksTab(); }
    }

    function onPercentageChange(index, value) {
      employeeTasks[index].percentage = parseInt(value) || 0;
      const panel = document.getElementById("panel-tasks");
      if (panel) { panel.innerHTML = renderTasksTab(); }
    }

    function onNotesChange(index, value) { employeeTasks[index].notes = value || ""; }

    async function saveTasks() {
      const btn = document.getElementById("btn-save-tasks");
      btn.disabled = true; btn.textContent = "⏳ در حال ذخیره...";
      try {
        let validTasks = employeeTasks.filter((t) => t.task_id && t.task_type).map((t) => ({ task_id: t.task_id, task_type: t.task_type, task_title: t.task_title, percentage: t.percentage || 0, notes: t.notes || null }));
        const mergedTasks = {};
        validTasks.forEach((t) => { const key = t.task_id; if (mergedTasks[key]) mergedTasks[key].percentage += t.percentage || 0; else mergedTasks[key] = { ...t }; });
        validTasks = Object.values(mergedTasks);
        const res = await fetch(`/api/employees/${personId}/tasks`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify({ tasks: validTasks }) });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "خطا");
        showToast("وظایف با موفقیت ذخیره شد");
        const tasksRes = await fetch(`/api/employees/${personId}/tasks`, { headers: { Authorization: `Bearer ${token}` } });
        employeeTasks = await tasksRes.json();
        const panel = document.getElementById("panel-tasks");
        if (panel) { panel.innerHTML = renderTasksTab(); }
      } catch (error) { showToast(error.message, "error"); } finally { btn.disabled = false; btn.textContent = "💾 ذخیره وظایف"; }
    }

    function switchTab(tabName, btn) {
      document.querySelectorAll(".tab-item").forEach((t) => t.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("panel-" + tabName).classList.add("active");
      if (tabName === "employment") { datePickersInitialized = false; setTimeout(initDatePickers, 100); }
      if (tabName === "tasks") { setTimeout(initCascade, 100); }
      if (tabName === "organization") { reloadOrgData(); }
    }

    async function saveEmployment() {
      const btn = document.getElementById("btn-save-employment");
      btn.disabled = true; btn.textContent = "⏳ در حال ذخیره...";
      try {
        const data = {
          contract_type: document.getElementById("input-contract-type").value || null,
          contract_start_shamsi: cleanDate(document.getElementById("input-contract-start").value),
          contract_end_shamsi: cleanDate(document.getElementById("input-contract-end").value),
          hire_date_shamsi: cleanDate(document.getElementById("input-hire-date").value),
          decree_type: document.getElementById("input-decree-type").value || null,
          employment_type: document.getElementById("input-employment-type").value.trim() || null,
          position: document.getElementById("input-position").value.trim() || null,
          department: document.getElementById("input-department").value || null,
          unit_start_shamsi: cleanDate(document.getElementById("input-unit-start-date").value),
          personnel_code: document.getElementById("input-personnel-code").value.trim() || null,
          specialties: document.getElementById("input-specialties").value.trim() || null,
          years_of_service: parseInt(document.getElementById("input-years-service").value) || 0,
          insurance_history_months: parseInt(document.getElementById("input-insurance-months").value) || 0,
          insurance_number: document.getElementById("input-insurance-number").value.trim() || null,
          education_level: document.getElementById("input-education-level").value || null,
          education_field: document.getElementById("input-education-field").value.trim() || null,
          education_university: document.getElementById("input-education-university").value.trim() || null,
          education_year_shamsi: document.getElementById("input-education-year").value.trim() || null,
          experience_years: parseInt(document.getElementById("input-experience-years").value) || 0,
          experience_description: document.getElementById("input-experience-description").value.trim() || null,
          birthday_shamsi: cleanDate(document.getElementById("input-birthday").value),
          other_occasion_shamsi: cleanDate(document.getElementById("input-other-occasion-date").value),
          other_occasion_title: document.getElementById("input-other-occasion-title").value.trim() || null,
          notes: document.getElementById("input-notes").value.trim() || null,
        };
        const res = await fetch(`/api/employees/${personId}`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(data) });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error || "خطا");
        showToast("اطلاعات استخدامی با موفقیت ذخیره شد");
      } catch (error) { showToast(error.message, "error"); } finally { btn.disabled = false; btn.textContent = "💾 ذخیره اطلاعات استخدامی"; }
    }

    function initDatePickers() {
      if (datePickersInitialized) return;
      const dateFields = ["input-hire-date", "input-contract-start", "input-contract-end", "input-birthday", "input-other-occasion-date", "input-unit-start-date"];
      dateFields.forEach((id) => {
        const el = document.getElementById(id);
        if (!el || el.disabled) return;
        const currentValue = el.value;
        try { $("#" + id).persianDatepicker("destroy"); } catch (e) { }
        $("#" + id).persianDatepicker({ format: "YYYY/MM/DD", autoClose: true, persianDigit: true, initialValue: !!currentValue, observer: true });
        if (currentValue) el.value = currentValue;
      });
      datePickersInitialized = true;
    }

    async function loadPositionsForOrg(orgId, selectedPositionId = null) {
      const select = document.getElementById('org-position-id');
      if (!select) return;
      select.innerHTML = '<option value="">— در حال بارگذاری —</option>';
      try {
        const res = await fetch(`/api/org-positions?organization_id=${orgId}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const positions = await res.json();
        select.innerHTML = '<option value="">— انتخاب کنید —</option>';
        if (positions.length === 0) { select.innerHTML = '<option value="">— پستی تعریف نشده —</option>'; return; }
        positions.forEach(pos => {
          const opt = document.createElement('option');
          opt.value = pos.id; opt.dataset.title = pos.position_title;
          opt.textContent = `${pos.position_title}${pos.is_primary ? ' (اصلی)' : ''}`;
          if (selectedPositionId && selectedPositionId === pos.id) opt.selected = true;
          select.appendChild(opt);
        });
      } catch (error) { select.innerHTML = '<option value="">— خطا —</option>'; }
    }

    function onOrgPositionChange() {
      const select = document.getElementById('org-position-id');
      const opt = select.options[select.selectedIndex];
      const title = opt?.dataset?.title || '';
      document.getElementById('org-role').value = title;
    }

    loadData();
    setTimeout(() => { if (typeof renderBreadcrumb === "function") renderBreadcrumb(); }, 300);
  </script>
</body>
</html>
