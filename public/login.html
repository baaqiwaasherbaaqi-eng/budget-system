<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سامانه بودجه شهرداری</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #eef1ff 0%, #f5f3ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.15), 0 2px 8px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(102, 126, 234, 0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 20px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
            font-size: 13px;
        }

        input {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: all 0.2s;
            background: #fafafa;
            text-align: center;
            letter-spacing: 2px;
            direction: ltr;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.otp-input {
            font-size: 24px;
            letter-spacing: 8px;
            font-weight: bold;
            font-family: 'Sahel', 'Vazirmatn', Tahoma, sans-serif;
        }

        button {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            display: none;
            margin-top: 15px;
            font-size: 13px;
            padding: 10px;
            background: #fee;
            border-radius: 6px;
        }

        .success {
            color: #28a745;
            text-align: center;
            display: none;
            margin-top: 15px;
            font-size: 13px;
            padding: 10px;
            background: #efe;
            border-radius: 6px;
        }

        .info {
            background: #e7f3ff;
            border-right: 4px solid #17a2b8;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 12px;
            color: #0c5460;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .user-greeting {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #333;
        }

        .user-greeting b {
            color: #667eea;
            font-size: 16px;
        }

        .mobile-info {
            text-align: center;
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        .mobile-info b {
            color: #333;
            direction: ltr;
            display: inline-block;
        }

        .back-btn {
            background: #e9ecef;
            color: #333;
            box-shadow: none;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: #dee2e6;
            transform: none;
            box-shadow: none;
        }

        .mock-badge {
            display: block;
            text-align: center;
            margin-top: 10px;
            font-size: 11px;
            color: #fd7e14;
            background: #fff3cd;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>سامانه بودجه شهرداری</h2>

        <div class="error" id="error-message"></div>
        <div class="success" id="success-message"></div>


        <!-- مرحله ۱: کد ملی یا نام کاربری -->
        <div class="step active" id="step-national-id">
            <div class="info">
                🔐 <b>ورود به سامانه</b><br>
                • <b>کارکنان:</b> کد ملی خود را وارد کنید (کد تایید پیامک می‌شود)<br>
                • <b>مدیران سیستم:</b> نام کاربری خود را وارد کنید (ورود با رمز عبور)
            </div>

            <div class="form-group">
                <label>کد ملی یا نام کاربری</label>
                <input type="text" id="national_id" placeholder="" />
            </div>

            <button onclick="requestOtp()" id="btn-request-otp">
                ادامه
            </button>
        </div>

        <!-- مرحله ۱.۵: پسورد (فقط برای admin/manager) -->
        <div class="step" id="step-password">
            <div class="user-greeting">
                خوش آمدید، <b id="password-username"></b>
            </div>

            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="password-input" placeholder="رمز عبور خود را وارد کنید" />
            </div>

            <button onclick="loginWithPassword()" id="btn-password-login">
                ورود
            </button>
            <button class="back-btn" onclick="goBack()">
                ← تغییر نام کاربری
            </button>
        </div>

        <!-- مرحله ۲: OTP -->
        <div class="step" id="step-otp">
            <div class="user-greeting">
                خوش آمدید، <b id="user-name-display"></b>
            </div>
            <div class="mobile-info">
                کد تایید به شماره <b id="mobile-display"></b> ارسال شد
            </div>

            <div class="form-group">
                <label>کد تایید (۶ رقمی)</label>
                <input type="text" id="otp_code" class="otp-input" placeholder="------" maxlength="6" />
            </div>

            <button onclick="verifyOtp()" id="btn-verify-otp">
                ورود
            </button>
            <button class="back-btn" onclick="goBack()">
                ← تغییر کد ملی
            </button>

            <span class="mock-badge" id="mock-otp-display"></span>
        </div>
    </div>

    <script>
        let currentOtpId = null;

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function showStep(stepId) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(stepId).classList.add('active');
        }

        // ============================================
        // درخواست کد (تشخیص خودکار)
        // ============================================
        async function requestOtp() {
            const rawInput = document.getElementById('national_id').value.trim();

            if (!rawInput) {
                showError('کد ملی یا نام کاربری را وارد کنید');
                return;
            }

            // تبدیل اعداد فارسی به انگلیسی
            const normalizedInput = rawInput.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

            // اگه فقط رقم و ۱۰ رقم بود → OTP
            // وگرنه → لاگین با پسورد (admin, manager, ...)
            const isNumeric = /^\d{10}$/.test(normalizedInput);

            if (isNumeric) {
                await requestOtpForNationalId(normalizedInput);
            } else {
                // نمایش فرم پسورد
                showPasswordStep(normalizedInput);
            }
        }

        async function requestOtpForNationalId(nationalId) {
            const btn = document.getElementById('btn-request-otp');
            btn.disabled = true;
            btn.textContent = '⏳ در حال ارسال...';

            try {
                const res = await fetch('/api/login/request-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ national_id: nationalId })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'خطا');

                currentOtpId = data.otp_id;

                document.getElementById('user-name-display').textContent = data.full_name;
                document.getElementById('mobile-display').textContent = data.mobile_masked;
                document.getElementById('otp_code').value = '';

                if (data.mock_otp) {
                    document.getElementById('mock-otp-display').textContent = 
                        `⚠️ حالت Mock - کد: ${data.mock_otp}`;
                }

                showStep('step-otp');
                document.getElementById('otp_code').focus();
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'ادامه';
            }
        }

        // ============================================
        // لاگین با پسورد (admin, manager)
        // ============================================
        function showPasswordStep(username) {
            document.getElementById('password-username').textContent = username;
            document.getElementById('password-input').value = '';

            showStep('step-password');
            document.getElementById('password-input').focus();
        }

        async function loginWithPassword() {
            const username = document.getElementById('password-username').textContent;
            const password = document.getElementById('password-input').value;

            if (!password) {
                showError('رمز عبور الزامی است');
                return;
            }

            const btn = document.getElementById('btn-password-login');
            btn.disabled = true;
            btn.textContent = '⏳ در حال ورود...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'خطا');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showSuccess('ورود موفق!');
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'ورود';
            }
        }

        // ============================================
        // OTP
        // ============================================
        async function verifyOtp() {
            const otpCode = document.getElementById('otp_code').value.trim();
            const normalizedOtp = otpCode.replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

            if (!normalizedOtp || normalizedOtp.length !== 6) {
                showError('کد تایید باید ۶ رقم باشد');
                return;
            }

            const btn = document.getElementById('btn-verify-otp');
            btn.disabled = true;
            btn.textContent = '⏳ در حال بررسی...';

            try {
                const res = await fetch('/api/login/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        otp_id: currentOtpId,
                        otp_code: normalizedOtp
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'خطا');

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showSuccess('ورود موفق!');
                setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);
            } catch (error) {
                showError(error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'ورود';
            }
        }

        function goBack() {
            currentOtpId = null;
            document.getElementById('otp_code').value = '';
            document.getElementById('mock-otp-display').textContent = '';
            document.getElementById('national_id').value = '';
            showStep('step-national-id');
            document.getElementById('error-message').style.display = 'none';
        }

        // Enter
        document.getElementById('otp_code')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') verifyOtp();
        });
        document.getElementById('password-input')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') loginWithPassword();
        });
        document.getElementById('national_id')?.addEventListener('keydown', e => {
            if (e.key === 'Enter') requestOtp();
        });
    </script>
    <script src="/footer.js"></script>
</body>
</html>
